# Adapted from https://github.com/c3g/snv-benchmarking-dashboard/blob/main/.github/workflows/build.yml
# Plain docker build + push, amd64 only (the C3G webapp VM is amd64): no QEMU/apt steps,
# which broke once ubuntu-latest moved to Ubuntu 26 (apt exit code 100).
name: Publish Container

on:
  release:
    types: [published]

jobs:
  release:
    runs-on: ubuntu-latest

    # Sets the permissions granted to the `GITHUB_TOKEN` for the actions in this job.
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Set image tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      ## CHANGE HERE ## image name: must match run.sh and deploy/c3g-cbioportal.service
      - name: Build and push image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          # Build with version tag
          docker build --pull -f Containerfile -t ${IMAGE}:${{ steps.tag.outputs.tag }} .

          # Push version tag
          docker push ${IMAGE}:${{ steps.tag.outputs.tag }}

          # Also tag as latest and push
          docker tag ${IMAGE}:${{ steps.tag.outputs.tag }} ${IMAGE}:latest
          docker push ${IMAGE}:latest
