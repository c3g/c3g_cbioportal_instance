# From the C3G web-app-template, for-app-developers.md "GitHub Actions: build & publish your container":
# https://github.com/c3g/web-app-template/blob/main/for-app-developers.md
# Only two changes, both allowed by the template for a single-architecture image:
#   1. the "Update package lists" + "Install QEMU" steps are removed (that apt step broke on newer runners);
#   2. archs: amd64 only (the C3G webapp VM is amd64).
# buildah-build's default (oci: false) builds in Docker format, which keeps the image HEALTHCHECK.
name: Publish Container

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  REGISTRY_USER: ${{ github.actor }}
  REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest

    # Sets the permissions granted to the `GITHUB_TOKEN` for the actions in this job.
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Git
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
      # Single architecture: amd64 (the webapp VM). Add ,arm64 + the template's QEMU steps for multi-arch
      - name: Build Container Image
        uses: redhat-actions/buildah-build@v2
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: latest ${{ github.event.release.tag_name }}
          # Make sure to adapt the path to your Containerfile
          containerfiles: ./Containerfile
          archs: amd64
      - name: Push to repo
        uses: redhat-actions/push-to-registry@v2
        with:
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}
          registry: ${{ env.REGISTRY }}
          image: ${{ env.IMAGE_NAME }}
          tags: latest ${{ github.event.release.tag_name }}
